version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      navaramap:
        patterns:
          - "@navaramap/*"
        update-types:
          - minor
          - patch
      vinext-cloudflare:
        patterns:
          - vinext
          - "@vinext/*"
          - "@cloudflare/*"
          - cf
        update-types:
          - minor
          - patch
      react:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      vite-vitest:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - tw-animate-css
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
