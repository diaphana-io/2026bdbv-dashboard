[workspace]
resolver = "2"
members = [
  "crates/surv_geom",
  "crates/surv_data",
  "crates/surv_analysis",
  "crates/surv_epi",
  "crates/surv_engine",
  "crates/surv_wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
geo = "0.28"
geojson = "1.0"

surv_geom = { path = "crates/surv_geom" }
surv_data = { path = "crates/surv_data" }
surv_analysis = { path = "crates/surv_analysis" }
surv_epi = { path = "crates/surv_epi" }
surv_engine = { path = "crates/surv_engine" }
